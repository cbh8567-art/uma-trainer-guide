name: Deploy GitHub Pages mirror

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "data/**"
      - ".github/workflows/pages-mirror.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate mirror files
        shell: bash
        run: |
          test -f index.html
          test -d data
          grep -q '<meta name="app-build" content="V7.0">' index.html
          if grep -nE "(fetchJson|fetch)\(['\"]/[^/]" index.html; then
            echo "::error::Root-absolute local fetch path found; GitHub Pages project sites require relative paths."
            exit 1
          fi
          echo "GitHub Pages mirror validation passed."

      - name: Prepare static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R data _site/data
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
