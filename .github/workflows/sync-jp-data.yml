name: JP validated data sync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

concurrency:
  group: jp-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync and validate JP data
        id: sync
        shell: bash
        run: |
          set +e
          node scripts/sync-jp-data.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run V6 integrity tests
        shell: bash
        run: node scripts/test-v6-integrity.mjs

      - name: Write Actions summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const state = read('data/jp/sync_state.json');
          const changes = read('data/jp/change_report.json');
          const health = read('data/jp/source_health.json');
          const review = read('data/jp/review_queue.json');
          const kr = read('data/kr/import_candidates.json');
          const system = read('data/jp/system_status.json');
          const scenario = read('data/jp/scenario_watch.json');
          const lines = [
            '# JP Data Sync',
            '',
            `- Status: **${state.status}**`,
            `- Mode: **${state.activeMode}**`,
            `- Last success: ${state.lastSuccessfulSync || 'none'}`,
            `- Changes: +${changes.summary?.added || 0} / -${changes.summary?.removed || 0} / modified ${changes.summary?.modified || 0}`,
            `- Source health: **${health.status}**`,
            `- Open review items: **${review.openCount || 0}**`,
            `- KR candidates: characters **${kr.characters?.length || 0}**, supports **${kr.supports?.length || 0}**`,
            `- Scenario watch: **${scenario.status}**`,
            `- Integrated status: **${system.status}**`,
            '',
            '## Collections'
          ];
          for (const [name, entry] of Object.entries(changes.collections || {})) {
            const c = entry.changes || {};
            lines.push(`- ${name}: ${entry.count} records · +${c.addedCount || 0} -${c.removedCount || 0} modified ${c.modifiedCount || 0}`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Commit sync result
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jp data/kr/import_candidates.json
          git commit -m "V6.0: sync integrated data pipeline"
          git push

      - name: Fail workflow when validation failed
        if: steps.sync.outputs.exit_code != '0'
        run: |
          echo "JP data validation failed. Existing snapshots were preserved."
          exit 1
