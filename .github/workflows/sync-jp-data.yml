name: JP validated data sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "scripts/**"
      - ".github/workflows/sync-jp-data.yml"
      - "data/common/**"
      - "data/kr/server_meta.json"
      - "data/kr/uma_ids.json"
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write
  statuses: read

concurrency:
  group: jp-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Classify change impact
        id: impact
        shell: bash
        run: node scripts/test-change-impact.mjs

      - name: Sync and validate JP data
        id: sync
        shell: bash
        run: |
          set +e
          node scripts/sync-jp-data.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run integrated integrity tests
        id: integrity
        if: steps.impact.outputs.full_test == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: bash
        run: node scripts/test-v6-integrity.mjs

      - name: Verify Vercel production deployment
        id: deploy
        if: steps.impact.outputs.deploy_smoke == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status"
          for i in $(seq 1 30); do
            json="$(curl -fsSL               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               "$api" || true)"
            state="$(printf '%s' "$json" | jq -r '
              [.statuses[]? | select(.context | contains("uma-trainer-guide-b3st"))][0].state // "pending"
            ')"
            description="$(printf '%s' "$json" | jq -r '
              [.statuses[]? | select(.context | contains("uma-trainer-guide-b3st"))][0].description // ""
            ')"
            echo "Vercel commit status: $state · $description · attempt $i/30"
            if [ "$state" = "success" ]; then
              echo "status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              if printf '%s' "$description" | grep -qi "rate limited"; then
                echo "status=rate_limited" >> "$GITHUB_OUTPUT"
                echo "::warning::Vercel deployment is rate limited; treating this as an external deployment-capacity warning, not an app validation failure."
                exit 0
              fi
              echo "status=failure" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            sleep 10
          done
          echo "status=timeout" >> "$GITHUB_OUTPUT"
          echo "Timed out waiting for the Vercel status of this exact commit."
          exit 1

      - name: Write automation report
        if: always()
        shell: bash
        env:
          SYNC_EXIT_CODE: ${{ steps.sync.outputs.exit_code }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_STATUS: ${{ steps.deploy.outputs.status }}
        run: node scripts/write-automation-report.mjs

      - name: Write Actions summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const state = read('data/jp/sync_state.json');
          const changes = read('data/jp/change_report.json');
          const health = read('data/jp/source_health.json');
          const review = read('data/jp/review_queue.json');
          const kr = read('data/kr/import_candidates.json');
          const system = read('data/jp/system_status.json');
          const scenario = read('data/jp/scenario_watch.json');
          const impact = read('data/jp/change_impact.json');
          const auto = read('data/jp/automation_report.json');
          const lines = [
            '# JP Data Sync V7.0',
            '',
            `- Automation: **${auto.status}**`,
            `- Impact: **${impact.impactLevel}** · changed files ${impact.changedFiles?.length || 0}`,
            `- Status: **${state.status}** · mode **${state.activeMode}**`,
            `- Changes: +${changes.summary?.added || 0} / -${changes.summary?.removed || 0} / modified ${changes.summary?.modified || 0}`,
            `- Source health: **${health.status}**`,
            `- Open review items: **${review.openCount || 0}**`,
            `- KR candidates: characters **${kr.characters?.length || 0}**, supports **${kr.supports?.length || 0}**`,
            `- Scenario watch: **${scenario.status}**`,
            `- Integrated status: **${system.status}**`,
            `- Integrity: **${auto.tests?.integrity || 'unknown'}** · deploy smoke: **${auto.tests?.deploySmoke || 'unknown'}**`,
            '',
            '## Collections'
          ];
          for (const [name, entry] of Object.entries(changes.collections || {})) {
            const c = entry.changes || {};
            lines.push(`- ${name}: ${entry.count} records · +${c.addedCount || 0} -${c.removedCount || 0} modified ${c.modifiedCount || 0}`);
          }
          if (auto.failures?.length) lines.push('', '## Failures', ...auto.failures.map(x => `- ${x}`));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Commit generated reports and snapshots
        if: always()
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jp data/kr/import_candidates.json
          git commit -m "V6.1: update automated validation reports"
          git push

      - name: Final validation gate
        if: always()
        shell: bash
        env:
          SYNC_EXIT_CODE: ${{ steps.sync.outputs.exit_code }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          failed=0
          if [ "${SYNC_EXIT_CODE:-0}" != "0" ]; then echo "JP sync validation failed."; failed=1; fi
          if [ "${INTEGRITY_OUTCOME:-skipped}" = "failure" ]; then echo "Integrity tests failed."; failed=1; fi
          if [ "${DEPLOY_OUTCOME:-skipped}" = "failure" ]; then echo "Vercel deployment verification failed."; failed=1; fi
          exit "$failed"
