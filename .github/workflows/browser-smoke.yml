name: Deployed browser smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/browser-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Selenium
        run: python -m pip install --quiet selenium

      - name: P0 current-build startup and controls smoke
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee p0-smoke.log
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import Select, WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          import os, re, urllib.request

          sha = os.environ.get("GITHUB_SHA", "main")
          raw = urllib.request.urlopen(f"https://raw.githubusercontent.com/cbh8567-art/uma-trainer-guide/{sha}/index.html", timeout=20).read().decode("utf-8")
          match = re.search(r'<meta name="app-build" content="([^"]+)"', raw)
          if not match:
              raise RuntimeError("Could not read app-build from pushed index.html")
          expected_build = match.group(1)
          url = "https://cbh8567-art.github.io/uma-trainer-guide/?p0=current"
          opts = Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=1440,1200")
          opts.set_capability("goog:loggingPrefs", {"browser":"ALL"})
          d = webdriver.Chrome(options=opts)
          d.set_window_size(1440, 1200)
          try:
              d.get(url)
              WebDriverWait(d, 25).until(lambda x: expected_build in x.title)
              WebDriverWait(d, 25).until(EC.presence_of_element_located((By.ID, "page-deck")))

              tabs = d.find_elements(By.CSS_SELECTOR, ".tab")
              names = [x.get_attribute("data-page") for x in tabs]
              print("P0 TAB NAMES:", names)
              for expected in ["deck", "guide", "tier", "info"]:
                  if expected not in names:
                      raise RuntimeError(f"Missing navigation tab: {expected}; got {names}")

              def click_tab(name):
                  tab = d.find_element(By.CSS_SELECTOR, f'.tab[data-page="{name}"]')
                  d.execute_script("arguments[0].click()", tab)
                  WebDriverWait(d, 10).until(
                      lambda x: "active" in x.find_element(By.ID, f"page-{name}").get_attribute("class").split()
                  )
                  print("P0 TAB PASS:", name)

              click_tab("guide")
              click_tab("tier")
              click_tab("info")

              WebDriverWait(d, 25).until(
                  lambda x: len(Select(x.find_element(By.ID, "racetrackPlace")).options) > 0
              )
              places = Select(d.find_element(By.ID, "racetrackPlace"))
              courses = Select(d.find_element(By.ID, "racetrackCourse"))
              if len(courses.options) == 0:
                  raise RuntimeError("Racetrack course selector is empty")
              print("P0 RACETRACK PASS:", len(places.options), "places,", len(courses.options), "courses")

              cards = d.find_elements(By.CSS_SELECTOR, "#racetrackInfoBody [data-course-id]")
              if not cards:
                  raise RuntimeError("Racetrack course cards were not rendered")
              d.execute_script("arguments[0].click()", cards[0])
              WebDriverWait(d, 8).until(
                  lambda x: len(x.find_elements(By.CSS_SELECTOR, "#racetrackInfoBody [data-course-id]")) > 0
              )
              print("P0 RACETRACK CARD PASS")

              click_tab("deck")
              toggle = d.find_element(By.ID, "toggleSsrDb")
              d.execute_script("arguments[0].click()", toggle)
              WebDriverWait(d, 8).until(lambda x: x.find_element(By.ID, "ssrDbBody").is_displayed())
              d.execute_script("arguments[0].click()", toggle)
              WebDriverWait(d, 8).until(lambda x: not x.find_element(By.ID, "ssrDbBody").is_displayed())
              print("P0 SSR DB TOGGLE PASS")

              kr_first = d.execute_script("""
                  return {server:state.activeServer,scenario:state.scenario,krAllowed:KOREA_SCENARIO_IDS.has('island'),
                    selected:document.getElementById('scenario')?.value,
                    banner:!!document.getElementById('openKrIslandGuideBtn'),
                    optionEnabled:![...document.getElementById('scenario').options].find(o=>o.value==='island')?.disabled};
              """)
              if kr_first.get("server") != "kr" or kr_first.get("scenario") != "island" or not kr_first.get("krAllowed") or not kr_first.get("banner") or not kr_first.get("optionEnabled"):
                  raise RuntimeError("V7.79 KR island first-run default not ready: "+str(kr_first))
              print("P0 KR ISLAND DEFAULT PASS:",kr_first)
              d.execute_script("setAppServer('jp')")
              scenario = d.find_element(By.ID, "scenario")
              Select(scenario).select_by_value("tresenken")
              d.execute_script("arguments[0].dispatchEvent(new Event('change', {bubbles:true}));", scenario)
              WebDriverWait(d, 10).until(
                  lambda x: not x.find_element(By.ID, "ramenScenarioGuide").get_property("hidden")
              )
              ramen_diag = d.execute_script("""
                  try {
                    setTrainingGuidePhase('ura');
                    return {
                      ok: true,
                      phase: ramenGuidePhase,
                      active: [...document.querySelectorAll('[data-ramen-phase].active')].map(x => x.dataset.ramenPhase),
                      body: document.getElementById('ramenGuideBody')?.innerText?.slice(0, 1600) || ''
                    };
                  } catch (e) {
                    return {
                      ok: false,
                      phase: (typeof ramenGuidePhase !== 'undefined' ? ramenGuidePhase : 'unavailable'),
                      name: e?.name || '',
                      message: e?.message || String(e),
                      stack: e?.stack || ''
                    };
                  }
              """)
              print("P0 RAMEN DIAG:", ramen_diag)
              if not ramen_diag.get("ok"):
                  raise RuntimeError("URA ramen render exception: " + str(ramen_diag))
              for expected in ["스페셜 트레센 라멘", "욕심쟁이 트레센 라멘", "주옥의 트레센 라멘"]:
                  if expected not in ramen_diag.get("body", ""):
                      raise RuntimeError("URA ramen render missing choice after direct phase switch: " + expected)

              logs = d.get_log("browser")
              js_severe = [
                  x for x in logs
                  if x.get("level") == "SEVERE"
                  and ("Uncaught" in x.get("message", "") or "javascript" in x.get("message", "").lower())
              ]
              for x in logs:
                  print("P0 BROWSER:", x.get("level"), x.get("message"))
              if js_severe:
                  raise RuntimeError("P0 browser console has severe JS errors: " + " | ".join(
                      x.get("message", "") for x in js_severe[:10]
                  ))
              print("P0", expected_build, "BROWSER PASS")
          finally:
              d.quit()
          PY

      - name: Browser interaction smoke test
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee browser-smoke.log
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import Select, WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          import os, re, urllib.request

          sha = os.environ.get("GITHUB_SHA", "main")
          raw = urllib.request.urlopen(f"https://raw.githubusercontent.com/cbh8567-art/uma-trainer-guide/{sha}/index.html", timeout=20).read().decode("utf-8")
          match = re.search(r'<meta name="app-build" content="([^"]+)"', raw)
          if not match:
              raise RuntimeError("Could not read app-build from pushed index.html")
          EXPECTED_BUILD = match.group(1)
          TARGETS = [
              ("pages", "https://cbh8567-art.github.io/uma-trainer-guide/?smoke=v7708", True),
              ("vercel-b3st", "https://uma-trainer-guide-b3st.vercel.app/?smoke=v7708", False),
              ("vercel-main", "https://uma-trainer-guide.vercel.app/?smoke=v7708", False),
          ]

          def make_driver(width=1440, height=1200):
              opts = Options()
              opts.add_argument("--headless=new")
              opts.add_argument("--no-sandbox")
              opts.add_argument("--disable-gpu")
              opts.add_argument(f"--window-size={width},{height}")
              opts.set_capability("goog:loggingPrefs", {"browser":"ALL"})
              driver = webdriver.Chrome(options=opts)
              driver.set_window_size(width, height)
              return driver

          def wait_app(driver):
              WebDriverWait(driver, 25).until(lambda d: "V7." in d.title)
              WebDriverWait(driver, 25).until(EC.presence_of_element_located((By.ID, "scenarioRareSkillPanel")))
              WebDriverWait(driver, 25).until(EC.presence_of_element_located((By.ID, "finishRamenLinkChoices")))

          def option_with_text(driver, section_id, text):
              rows = driver.find_elements(By.CSS_SELECTOR, f"#{section_id} .finishOption")
              for row in rows:
                  if text in row.text:
                      return row
              raise RuntimeError(f"Could not find option containing {text!r} in #{section_id}; rows={len(rows)}")

          def wait_images(driver, section_id, text, expected_min=1):
              # External image CDNs can be slow/flaky in CI. Verify the badge DOM first,
              # then try to confirm pixels without making an unrelated network hiccup fail the app smoke.
              def present(_):
                  try:
                      row = option_with_text(driver, section_id, text)
                      imgs = row.find_elements(By.CSS_SELECTOR, ".linkCharIcon")
                      return (row, imgs) if len(imgs) >= expected_min else False
                  except Exception:
                      return False
              row, imgs = WebDriverWait(driver, 18).until(present)
              try:
                  WebDriverWait(driver, 5).until(lambda d: all(
                      d.execute_script("return arguments[0].complete && arguments[0].naturalWidth > 0", img)
                      for img in imgs
                  ))
              except Exception:
                  print("IMAGE LOAD WARN:", section_id, text, "badges=", len(imgs))
              return row, imgs

          def select_scenario(driver, value):
              select_el = driver.find_element(By.ID, "scenario")
              Select(select_el).select_by_value(value)
              driver.execute_script(
                  "arguments[0].dispatchEvent(new Event('change', {bubbles:true}));",
                  select_el
              )
              WebDriverWait(driver, 12).until(
                  lambda d: d.find_element(By.ID, "scenarioRareSkillPanel").is_displayed()
              )
              if value in {"tresenken", "dreams", "onsen", "island", "harvest", "mecha"}:
                  WebDriverWait(driver, 12).until(
                      lambda d: len(d.find_elements(By.CSS_SELECTOR, "#finishRamenLinkChoices .finishOption")) > 0
                  )

          def check_scenario_badges(driver):
              # Tracenken: always-gold staff row must show both Tazuna + Light Hello;
              # a normal unlinked Uma row must remain white skill on a fresh profile.
              select_scenario(driver, "tresenken")
              staff, staff_imgs = wait_images(driver, "finishRamenLinkChoices", "타즈나 & 라이트 하로", 2)
              if len(staff_imgs) < 2:
                  raise RuntimeError("Tracenken staff row did not render two character badges")
              if "금스킬" not in staff.find_element(By.CSS_SELECTOR, ".finishRight").text:
                  raise RuntimeError("Tracenken staff row should be gold skill")
              fine = option_with_text(driver, "finishRamenLinkChoices", "파인 모션")
              if "백스킬" not in fine.find_element(By.CSS_SELECTOR, ".finishRight").text:
                  raise RuntimeError("Unlinked Fine Motion row should be white skill on a fresh profile")

              cases = [
                  ("dreams", "카지노 드라이브"),
                  ("onsen", "호시나 켄코"),
                  ("island", "터커 브라인"),
                  ("harvest", "아키카와 이사장"),
                  ("mecha", "슈가 라이츠"),
              ]
              for scenario, label in cases:
                  select_scenario(driver, scenario)
                  row, _ = wait_images(driver, "finishRamenLinkChoices", label, 1)
                  print("BADGE PASS:", scenario, label, row.find_element(By.CSS_SELECTOR, ".finishRight").text)

              sugar = option_with_text(driver, "finishRamenLinkChoices", "슈가 라이츠")
              if "금스킬" not in sugar.find_element(By.CSS_SELECTOR, ".finishRight").text:
                  raise RuntimeError("Sugar Lights row should be always-gold")

          def check_mobile(driver):
              driver.set_window_size(390, 844)
              driver.refresh()
              wait_app(driver)
              select_scenario(driver, "tresenken")
              panel = driver.find_element(By.ID, "scenarioRareSkillPanel")
              driver.execute_script("arguments[0].scrollIntoView({block:'start'});", panel)
              time.sleep(0.6)
              metrics = driver.execute_script("""
                  const panel = document.querySelector('#scenarioRareSkillPanel');
                  const rows = [...panel.querySelectorAll('.finishOption')].filter(x => x.offsetParent !== null);
                  return {
                    viewport: window.innerWidth,
                    documentWidth: document.documentElement.scrollWidth,
                    panelRight: panel.getBoundingClientRect().right,
                    panelLeft: panel.getBoundingClientRect().left,
                    rowOverflow: rows.filter(x => x.scrollWidth > x.clientWidth + 1).length,
                    rowCount: rows.length,
                    dockDisplay: getComputedStyle(document.querySelector('#mobileDock')).display,
                    widest: [...document.querySelectorAll('body *')].map(el => {
                      const r = el.getBoundingClientRect();
                      return {tag:el.tagName,id:el.id||'',cls:(el.className&&String(el.className).slice(0,80))||'',left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),scrollWidth:el.scrollWidth};
                    }).filter(x => x.right > window.innerWidth + 1 || x.width > window.innerWidth + 1)
                      .sort((a,b)=>Math.max(b.right,b.width)-Math.max(a.right,a.width)).slice(0,12)
                  };
              """)
              print("MOBILE METRICS:", metrics)
              if metrics["documentWidth"] > metrics["viewport"] + 1:
                  raise RuntimeError(f"Mobile horizontal overflow: {metrics}")
              if metrics["panelLeft"] < -1 or metrics["panelRight"] > metrics["viewport"] + 1:
                  raise RuntimeError(f"Scenario panel clipped on mobile: {metrics}")
              if metrics["rowOverflow"] != 0:
                  raise RuntimeError(f"Scenario option content overflow on mobile: {metrics}")
              if metrics["dockDisplay"] == "none":
                  raise RuntimeError("Mobile dock should be visible at 390px")

          for name, url, required in TARGETS:
              print("\n=== TARGET", name, url, "required=", required, "===")
              d = make_driver()
              try:
                  d.get(url)
                  wait_app(d)
                  print("TITLE:", d.title)
                  current_build = EXPECTED_BUILD in d.title
                  if required and not current_build:
                      raise RuntimeError(f"Required browser target is stale: expected {EXPECTED_BUILD}, got {d.title}")
                  if not required and not current_build:
                      print("STALE DEPLOYMENT WARN:", name, "expected", EXPECTED_BUILD, "got", d.title)
                      continue
                  # V7.9 spectator mode: verify HTTPS screen-share UI/API without invoking the permission dialog.
                  watch_start = d.find_element(By.ID, "watchPilotStart")
                  watch_video = d.find_element(By.ID, "watchPilotVideo")
                  capture_api = d.execute_script("return !!window.isSecureContext && !!navigator.mediaDevices && typeof navigator.mediaDevices.getDisplayMedia === 'function'")
                  if not watch_start or not watch_video:
                      raise RuntimeError("Spectator screen-share UI is missing")
                  if not capture_api:
                      raise RuntimeError("getDisplayMedia is unavailable on deployed HTTPS target")
                  print("WATCH PILOT DOM/API PASS")

                  # V7.79: KR-first fresh profile, officially launched island and separate JP mode.
                  WebDriverWait(d, 25).until(lambda x: x.execute_script("return typeof runtime !== 'undefined' && runtime.ready === true"))
                  kr_verify = d.execute_script("""
                      const cold={active:state.activeServer,scenario:state.scenario,
                        visible:!document.querySelector('#scenario option[value="island"]').disabled,
                        title:SCENARIOS.island.kr,friend:isKoreanImplementedSupport(cardById(30257))};
                      const initialKr=state.serverProfiles.kr,krDeckBefore=JSON.stringify(initialKr?.deck||[]);
                      const modal=()=>document.querySelector('#scenarioPlanBody')?.innerText||'';
                      renderScenarioPlan();
                      const krText=modal(),card=cardById(30257);
                      const oldKr=JSON.parse(JSON.stringify(state.serverProfiles.kr||{}));
                      const oldJp=JSON.parse(JSON.stringify(state.serverProfiles.jp||{}));
                      const jpHad=JSON.stringify(state.serverProfiles.jp);
                      const baseline=!!card&&isSupportVisibleForServer(card);
                      const jpBefore=state.serverProfiles.jp?.scenario;
                      const panel=document.getElementById('scenarioPlanPanel');
                      if(state.activeServer!=='kr')setAppServer('kr');
                      const beforeButton=document.getElementById('openKrIslandGuideBtn');
                      if(beforeButton)beforeButton.click();
                      const bannerResult={active:state.activeServer,scenario:state.scenario,hasKrUi:modal().includes('한국 서버 · 무인도에 어서 오세요'),
                        hasNotice:modal().includes('2026.10.16'),fullLabel:SCENARIOS.island.kr};
                      setAppServer('jp');
                      const persistedKr=state.serverProfiles.kr?.scenario;
                      const jpNotClobbered=state.scenario===jpBefore;
                      setAppServer('kr');
                      const returnedKr=state.scenario==='island';
                      setAppServer('jp');
                      return {cold,hasKrUi:krText.includes('한국 서버 · 무인도에 어서 오세요'),
                        hasKrRef:krText.includes('한국 공식 공지'),krTucker:!!baseline,
                        bannerResult,persistedKr,jpNotClobbered,returnedKr};
                  """)
                  if kr_verify.get("cold",{}).get("active") != "kr" or kr_verify.get("cold",{}).get("scenario") != "island":
                      raise RuntimeError("KR default inactive: "+str(kr_verify))
                  if not kr_verify.get("cold",{}).get("visible") or not kr_verify.get("hasKrUi") or not kr_verify.get("hasKrRef") or not kr_verify.get("krTucker"):
                      raise RuntimeError("KR island UI/support missing: "+str(kr_verify))
                  if not kr_verify.get("jpNotClobbered") or not kr_verify.get("returnedKr") or kr_verify.get("bannerResult",{}).get("scenario") != "island":
                      raise RuntimeError("KR/JP profile separation failed: "+str(kr_verify))
                  print("KR ISLAND V7.79 LAUNCH / UI / TUCKER / SERVER ISOLATION PASS:",kr_verify)

                  # Current build: animated Agnes Digital mascot + favicon asset.
                  mascot = d.find_element(By.ID, "digitalMascotFloating")
                  mascot_img = mascot.find_element(By.TAG_NAME, "img")
                  mascot_src = mascot_img.get_attribute("src") or ""
                  if "assets/digital-mascot.gif" not in mascot_src:
                      raise RuntimeError(f"Digital mascot GIF source mismatch: {mascot_src}")
                  if not mascot.is_displayed():
                      raise RuntimeError("Digital floating mascot should stay visible")
                  favicon_hrefs = [
                      x.get_attribute("href") or ""
                      for x in d.find_elements(By.CSS_SELECTOR, 'link[rel~="icon"]')
                  ]
                  if not any("assets/digital-mascot.gif" in href for href in favicon_hrefs):
                      raise RuntimeError(f"Digital favicon missing: {favicon_hrefs}")
                  print("DIGITAL MASCOT / FAVICON PASS")

                  # Current build: mascot can be dragged and stores its position.
                  before = d.execute_script("""
                      const e=document.getElementById('digitalMascotFloating'),r=e.getBoundingClientRect();
                      return {left:r.left,top:r.top};
                  """)
                  d.execute_script("""
                      const e=document.getElementById('digitalMascotFloating'),r=e.getBoundingClientRect();
                      const id=77;
                      e.dispatchEvent(new PointerEvent('pointerdown',{pointerId:id,pointerType:'mouse',button:0,clientX:r.left+10,clientY:r.top+10,bubbles:true}));
                      e.dispatchEvent(new PointerEvent('pointermove',{pointerId:id,pointerType:'mouse',button:0,clientX:r.left+70,clientY:r.top+55,bubbles:true}));
                      e.dispatchEvent(new PointerEvent('pointerup',{pointerId:id,pointerType:'mouse',button:0,clientX:r.left+70,clientY:r.top+55,bubbles:true}));
                  """)
                  after = d.execute_script("""
                      const e=document.getElementById('digitalMascotFloating'),r=e.getBoundingClientRect();
                      return {left:r.left,top:r.top,saved:localStorage.getItem('uma_trainer_digital_mascot_pos_v1')};
                  """)
                  if abs(after["left"]-before["left"]) < 20 and abs(after["top"]-before["top"]) < 20:
                      raise RuntimeError(f"Digital mascot drag did not move: before={before}, after={after}")
                  if not after["saved"]:
                      raise RuntimeError("Digital mascot position was not persisted")
                  print("DIGITAL MASCOT DRAG PASS:", before, "->", after)

                  # Current build: Digital guidance bubble points to the first missing setup step.
                  WebDriverWait(d, 25).until(
                      lambda x: x.execute_script("return typeof runtime !== 'undefined' && runtime.ready === true")
                  )
                  d.execute_script("""
                      state.currentUmaId=null;
                      state.currentUmaConfirmed=false;
                      state.inheritanceConfirmed=false;
                      state.deckConfirmed=false;
                      state.scenarioPlanConfirmed=false;
                      state.trainingActive=false;
                      renderAll();
                  """)
                  WebDriverWait(d, 8).until(lambda x: not x.find_element(By.ID, "digitalMascotBubble").get_attribute("hidden"))
                  bubble_text = d.find_element(By.ID, "digitalMascotBubble").get_attribute("textContent") or ""
                  if "육성 우마무스메" not in bubble_text:
                      raise RuntimeError(f"Digital guide should request training Uma first: {bubble_text}")
                  time.sleep(0.12)
                  d.execute_script("document.getElementById('digitalMascotFloating').click()")
                  WebDriverWait(d, 8).until(lambda x: x.find_element(By.ID, "umaPickerModal").get_attribute("class").find("open") >= 0)
                  d.execute_script("document.getElementById('umaPickerModal').classList.remove('open')")
                  print("DIGITAL STEP NAVIGATOR PASS:", bubble_text)

                  # V7.70.12 regression: aborting a live training session reopens the Uma picker.
                  d.execute_script("""
                      state.trainingActive=true;
                      window.confirm=()=>true;
                      abortTrainingSession();
                  """)
                  WebDriverWait(d, 8).until(lambda x: x.find_element(By.ID, "umaPickerModal").get_attribute("class").find("open") >= 0)
                  if d.execute_script("return state.currentUmaId") is not None:
                      raise RuntimeError("Abort should clear current training Uma before reopening picker")
                  d.execute_script("document.getElementById('umaPickerModal').classList.remove('open')")
                  print("ABORT UMA PICKER RECOVERY PASS")

                  # V7.11: compact SSR DB and deck-first card picker.
                  db_body = d.find_element(By.ID, "ssrDbBody")
                  if db_body.is_displayed():
                      raise RuntimeError("SSR DB should be collapsed by default")
                  toggle_db = d.find_element(By.ID, "toggleSsrDb")
                  d.execute_script("arguments[0].click()", toggle_db)
                  WebDriverWait(d, 8).until(lambda x: x.find_element(By.ID, "ssrDbBody").is_displayed())
                  d.execute_script("arguments[0].click()", toggle_db)
                  WebDriverWait(d, 8).until(lambda x: not x.find_element(By.ID, "ssrDbBody").is_displayed())
                  rec = d.find_element(By.ID, "dbGuideRecommend")
                  global_skills = d.find_element(By.ID, "globalSkills")
                  rec_before = d.execute_script(
                      "return !!(arguments[0].compareDocumentPosition(arguments[1]) & Node.DOCUMENT_POSITION_FOLLOWING)",
                      rec, global_skills
                  )
                  if not rec_before:
                      raise RuntimeError("Trainer Guide recommended SSR strip should be directly before skill sections")
                  scopes = d.find_elements(By.CSS_SELECTOR, "#emptySlotScope [data-picker-scope]")
                  if len(scopes) != 3:
                      raise RuntimeError(f"Expected 3 deck picker scopes, got {len(scopes)}")
                  print("SSR COMPACT UI PASS")

                  # Current build: Friend/Group supports keep card functionality but show no recommendation rating UI.
                  friend_group = d.execute_script("""
                      const card=runtime.catalog.find(c=>c.type==='친구'||c.type==='그룹');
                      if(!card)return {ok:false,reason:'no friend/group support in catalog'};
                      catType=card.type;
                      renderCatalog();
                      const node=[...document.querySelectorAll('#catalog .card')].find(x=>x.textContent.includes(card.krName));
                      if(!node)return {ok:false,reason:'friend/group card not rendered',type:card.type,name:card.krName};
                      const rec=node.querySelector('.recInline');
                      const badge=node.querySelector('.scenarioRec');
                      openCardInfo(card.id);
                      const detail=document.querySelector('#cardInfo .supportRecommendationDetail');
                      return {
                        ok:true,
