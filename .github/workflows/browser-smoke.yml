name: GitHub Pages browser smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/browser-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Install Selenium
        run: python -m pip install --quiet selenium

      - name: Browser interaction smoke test
        shell: bash
        run: |
          python - <<'PY'
          import time, sys
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          url = "https://cbh8567-art.github.io/uma-trainer-guide/?smoke=selenium"
          opts = Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=1440,1200")
          opts.set_capability("goog:loggingPrefs", {"browser":"ALL"})

          d = webdriver.Chrome(options=opts)
          try:
              d.get(url)
              time.sleep(3)
              title = d.title
              print("TITLE:", title)

              logs = d.get_log("browser")
              severe = [x for x in logs if x.get("level") == "SEVERE"]
              for x in logs:
                  print("BROWSER:", x.get("level"), x.get("message"))
              if severe:
                  raise RuntimeError("Browser console has SEVERE errors: " + " | ".join(x.get("message","") for x in severe[:10]))

              tabs = d.find_elements(By.CSS_SELECTOR, ".tab")
              print("TAB COUNT:", len(tabs))
              if len(tabs) < 2:
                  raise RuntimeError("Expected at least 2 navigation tabs")

              before = d.find_element(By.CSS_SELECTOR, ".page.active").get_attribute("id")
              tabs[1].click()
              time.sleep(0.5)
              after = d.find_element(By.CSS_SELECTOR, ".page.active").get_attribute("id")
              print("ACTIVE PAGE:", before, "->", after)
              if before == after:
                  raise RuntimeError("Navigation tab click did not change active page")

              status = d.find_element(By.ID, "jpSyncStatus").text
              print("JP STATUS:", status)
              print("Browser interaction smoke PASS")
          finally:
              d.quit()
          PY
