name: Deployed browser smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/browser-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Selenium
        run: python -m pip install --quiet selenium

      - name: P0 V7.70.5 startup and controls smoke
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee p0-smoke.log
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import Select, WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          url = "https://cbh8567-art.github.io/uma-trainer-guide/?p0=v7703"
          opts = Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=1440,1200")
          opts.set_capability("goog:loggingPrefs", {"browser":"ALL"})
          d = webdriver.Chrome(options=opts)
          d.set_window_size(1440, 1200)
          try:
              d.get(url)
              WebDriverWait(d, 25).until(lambda x: "V7.70.5" in x.title)
              WebDriverWait(d, 25).until(EC.presence_of_element_located((By.ID, "page-deck")))

              tabs = d.find_elements(By.CSS_SELECTOR, ".tab")
              names = [x.get_attribute("data-page") for x in tabs]
              print("P0 TAB NAMES:", names)
              for expected in ["deck", "guide", "tier", "info"]:
                  if expected not in names:
                      raise RuntimeError(f"Missing navigation tab: {expected}; got {names}")

              def click_tab(name):
                  tab = d.find_element(By.CSS_SELECTOR, f'.tab[data-page="{name}"]')
                  d.execute_script("arguments[0].click()", tab)
                  WebDriverWait(d, 10).until(
                      lambda x: "active" in x.find_element(By.ID, f"page-{name}").get_attribute("class").split()
                  )
                  print("P0 TAB PASS:", name)

              click_tab("guide")
              click_tab("tier")
              click_tab("info")

              WebDriverWait(d, 25).until(
                  lambda x: len(Select(x.find_element(By.ID, "racetrackPlace")).options) > 0
              )
              places = Select(d.find_element(By.ID, "racetrackPlace"))
              courses = Select(d.find_element(By.ID, "racetrackCourse"))
              if len(courses.options) == 0:
                  raise RuntimeError("Racetrack course selector is empty")
              print("P0 RACETRACK PASS:", len(places.options), "places,", len(courses.options), "courses")

              cards = d.find_elements(By.CSS_SELECTOR, "#racetrackInfoBody [data-course-id]")
              if not cards:
                  raise RuntimeError("Racetrack course cards were not rendered")
              d.execute_script("arguments[0].click()", cards[0])
              WebDriverWait(d, 8).until(
                  lambda x: len(x.find_elements(By.CSS_SELECTOR, "#racetrackInfoBody [data-course-id]")) > 0
              )
              print("P0 RACETRACK CARD PASS")

              click_tab("deck")
              toggle = d.find_element(By.ID, "toggleSsrDb")
              d.execute_script("arguments[0].click()", toggle)
              WebDriverWait(d, 8).until(lambda x: x.find_element(By.ID, "ssrDbBody").is_displayed())
              d.execute_script("arguments[0].click()", toggle)
              WebDriverWait(d, 8).until(lambda x: not x.find_element(By.ID, "ssrDbBody").is_displayed())
              print("P0 SSR DB TOGGLE PASS")

              scenario = d.find_element(By.ID, "scenario")
              Select(scenario).select_by_value("tresenken")
              d.execute_script("arguments[0].dispatchEvent(new Event('change', {bubbles:true}));", scenario)
              WebDriverWait(d, 10).until(
                  lambda x: not x.find_element(By.ID, "ramenScenarioGuide").get_property("hidden")
              )
              ramen_diag = d.execute_script("""
                  try {
                    setTrainingGuidePhase('ura');
                    return {
                      ok: true,
                      phase: ramenGuidePhase,
                      active: [...document.querySelectorAll('[data-ramen-phase].active')].map(x => x.dataset.ramenPhase),
                      body: document.getElementById('ramenGuideBody')?.innerText?.slice(0, 1600) || ''
                    };
                  } catch (e) {
                    return {
                      ok: false,
                      phase: (typeof ramenGuidePhase !== 'undefined' ? ramenGuidePhase : 'unavailable'),
                      name: e?.name || '',
                      message: e?.message || String(e),
                      stack: e?.stack || ''
                    };
                  }
              """)
              print("P0 RAMEN DIAG:", ramen_diag)
              if not ramen_diag.get("ok"):
                  raise RuntimeError("URA ramen render exception: " + str(ramen_diag))
              for expected in ["스페셜 트레센 라멘", "욕심쟁이 트레센 라멘", "주옥의 트레센 라멘"]:
                  if expected not in ramen_diag.get("body", ""):
                      raise RuntimeError("URA ramen render missing choice after direct phase switch: " + expected)

              logs = d.get_log("browser")
              js_severe = [
                  x for x in logs
                  if x.get("level") == "SEVERE"
                  and ("Uncaught" in x.get("message", "") or "javascript" in x.get("message", "").lower())
              ]
              for x in logs:
                  print("P0 BROWSER:", x.get("level"), x.get("message"))
              if js_severe:
                  raise RuntimeError("P0 browser console has severe JS errors: " + " | ".join(
                      x.get("message", "") for x in js_severe[:10]
                  ))
              print("P0 V7.70.5 BROWSER PASS")
          finally:
              d.quit()
          PY

      - name: Browser interaction smoke test
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee browser-smoke.log
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import Select, WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          EXPECTED_BUILD = "V7.70.5"
          TARGETS = [
              ("pages", "https://cbh8567-art.github.io/uma-trainer-guide/?smoke=v7705", True),
              ("vercel-b3st", "https://uma-trainer-guide-b3st.vercel.app/?smoke=v7705", False),
              ("vercel-main", "https://uma-trainer-guide.vercel.app/?smoke=v7705", False),
          ]

          def make_driver(width=1440, height=1200):
              opts = Options()
              opts.add_argument("--headless=new")
              opts.add_argument("--no-sandbox")
              opts.add_argument("--disable-gpu")
              opts.add_argument(f"--window-size={width},{height}")
              opts.set_capability("goog:loggingPrefs", {"browser":"ALL"})
              driver = webdriver.Chrome(options=opts)
              driver.set_window_size(width, height)
              return driver

          def wait_app(driver):
              WebDriverWait(driver, 25).until(lambda d: "V7." in d.title)
              WebDriverWait(driver, 25).until(EC.presence_of_element_located((By.ID, "scenarioRareSkillPanel")))
              WebDriverWait(driver, 25).until(EC.presence_of_element_located((By.ID, "finishRamenLinkChoices")))

          def option_with_text(driver, section_id, text):
              rows = driver.find_elements(By.CSS_SELECTOR, f"#{section_id} .finishOption")
              for row in rows:
                  if text in row.text:
                      return row
              raise RuntimeError(f"Could not find option containing {text!r} in #{section_id}; rows={len(rows)}")

          def wait_images(driver, section_id, text, expected_min=1):
              # External image CDNs can be slow/flaky in CI. Verify the badge DOM first,
              # then try to confirm pixels without making an unrelated network hiccup fail the app smoke.
              def present(_):
                  try:
                      row = option_with_text(driver, section_id, text)
                      imgs = row.find_elements(By.CSS_SELECTOR, ".linkCharIcon")
                      return (row, imgs) if len(imgs) >= expected_min else False
                  except Exception:
                      return False
              row, imgs = WebDriverWait(driver, 18).until(present)
              try:
                  WebDriverWait(driver, 5).until(lambda d: all(
                      d.execute_script("return arguments[0].complete && arguments[0].naturalWidth > 0", img)
                      for img in imgs
                  ))
              except Exception:
                  print("IMAGE LOAD WARN:", section_id, text, "badges=", len(imgs))
              return row, imgs

          def select_scenario(driver, value):
              select_el = driver.find_element(By.ID, "scenario")
              Select(select_el).select_by_value(value)
              driver.execute_script(
                  "arguments[0].dispatchEvent(new Event('change', {bubbles:true}));",
                  select_el
              )
              WebDriverWait(driver, 12).until(
                  lambda d: d.find_element(By.ID, "scenarioRareSkillPanel").is_displayed()
              )
              if value in {"tresenken", "dreams", "onsen", "island", "harvest", "mecha"}:
                  WebDriverWait(driver, 12).until(
                      lambda d: len(d.find_elements(By.CSS_SELECTOR, "#finishRamenLinkChoices .finishOption")) > 0
                  )

          def check_scenario_badges(driver):
              # Tracenken: always-gold staff row must show both Tazuna + Light Hello;
              # a normal unlinked Uma row must remain white skill on a fresh profile.
              select_scenario(driver, "tresenken")
              staff, staff_imgs = wait_images(driver, "finishRamenLinkChoices", "타즈나 & 라이트 하로", 2)
              if len(staff_imgs) < 2:
                  raise RuntimeError("Tracenken staff row did not render two character badges")
              if "금스킬" not in staff.find_element(By.CSS_SELECTOR, ".finishRight").text:
                  raise RuntimeError("Tracenken staff row should be gold skill")
              fine = option_with_text(driver, "finishRamenLinkChoices", "파인 모션")
              if "백스킬" not in fine.find_element(By.CSS_SELECTOR, ".finishRight").text:
                  raise RuntimeError("Unlinked Fine Motion row should be white skill on a fresh profile")

              cases = [
                  ("dreams", "카지노 드라이브"),
                  ("onsen", "호시나 켄코"),
                  ("island", "터커 브라인"),
                  ("harvest", "아키카와 이사장"),
                  ("mecha", "슈가 라이츠"),
              ]
              for scenario, label in cases:
                  select_scenario(driver, scenario)
                  row, _ = wait_images(driver, "finishRamenLinkChoices", label, 1)
                  print("BADGE PASS:", scenario, label, row.find_element(By.CSS_SELECTOR, ".finishRight").text)

              sugar = option_with_text(driver, "finishRamenLinkChoices", "슈가 라이츠")
              if "금스킬" not in sugar.find_element(By.CSS_SELECTOR, ".finishRight").text:
                  raise RuntimeError("Sugar Lights row should be always-gold")

          def check_mobile(driver):
              driver.set_window_size(390, 844)
              driver.refresh()
              wait_app(driver)
              select_scenario(driver, "tresenken")
              panel = driver.find_element(By.ID, "scenarioRareSkillPanel")
              driver.execute_script("arguments[0].scrollIntoView({block:'start'});", panel)
              time.sleep(0.6)
              metrics = driver.execute_script("""
                  const panel = document.querySelector('#scenarioRareSkillPanel');
                  const rows = [...panel.querySelectorAll('.finishOption')].filter(x => x.offsetParent !== null);
                  return {
                    viewport: window.innerWidth,
                    documentWidth: document.documentElement.scrollWidth,
                    panelRight: panel.getBoundingClientRect().right,
                    panelLeft: panel.getBoundingClientRect().left,
                    rowOverflow: rows.filter(x => x.scrollWidth > x.clientWidth + 1).length,
                    rowCount: rows.length,
                    dockDisplay: getComputedStyle(document.querySelector('#mobileDock')).display,
                    widest: [...document.querySelectorAll('body *')].map(el => {
                      const r = el.getBoundingClientRect();
                      return {tag:el.tagName,id:el.id||'',cls:(el.className&&String(el.className).slice(0,80))||'',left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),scrollWidth:el.scrollWidth};
                    }).filter(x => x.right > window.innerWidth + 1 || x.width > window.innerWidth + 1)
                      .sort((a,b)=>Math.max(b.right,b.width)-Math.max(a.right,a.width)).slice(0,12)
                  };
              """)
              print("MOBILE METRICS:", metrics)
              if metrics["documentWidth"] > metrics["viewport"] + 1:
                  raise RuntimeError(f"Mobile horizontal overflow: {metrics}")
              if metrics["panelLeft"] < -1 or metrics["panelRight"] > metrics["viewport"] + 1:
                  raise RuntimeError(f"Scenario panel clipped on mobile: {metrics}")
              if metrics["rowOverflow"] != 0:
                  raise RuntimeError(f"Scenario option content overflow on mobile: {metrics}")
              if metrics["dockDisplay"] == "none":
                  raise RuntimeError("Mobile dock should be visible at 390px")

          for name, url, required in TARGETS:
              print("\n=== TARGET", name, url, "required=", required, "===")
              d = make_driver()
              try:
                  d.get(url)
                  wait_app(d)
                  print("TITLE:", d.title)
                  current_build = EXPECTED_BUILD in d.title
                  if required and not current_build:
                      raise RuntimeError(f"Required browser target is stale: expected {EXPECTED_BUILD}, got {d.title}")
                  if not required and not current_build:
                      print("STALE DEPLOYMENT WARN:", name, "expected", EXPECTED_BUILD, "got", d.title)
                      continue
                  # V7.9 spectator mode: verify HTTPS screen-share UI/API without invoking the permission dialog.
                  watch_start = d.find_element(By.ID, "watchPilotStart")
                  watch_video = d.find_element(By.ID, "watchPilotVideo")
                  capture_api = d.execute_script("return !!window.isSecureContext && !!navigator.mediaDevices && typeof navigator.mediaDevices.getDisplayMedia === 'function'")
                  if not watch_start or not watch_video:
                      raise RuntimeError("Spectator screen-share UI is missing")
                  if not capture_api:
                      raise RuntimeError("getDisplayMedia is unavailable on deployed HTTPS target")
                  print("WATCH PILOT DOM/API PASS")

                  # V7.11: compact SSR DB and deck-first card picker.
                  db_body = d.find_element(By.ID, "ssrDbBody")
                  if db_body.is_displayed():
                      raise RuntimeError("SSR DB should be collapsed by default")
                  toggle_db = d.find_element(By.ID, "toggleSsrDb")
                  d.execute_script("arguments[0].click()", toggle_db)
                  WebDriverWait(d, 8).until(lambda x: x.find_element(By.ID, "ssrDbBody").is_displayed())
                  d.execute_script("arguments[0].click()", toggle_db)
                  WebDriverWait(d, 8).until(lambda x: not x.find_element(By.ID, "ssrDbBody").is_displayed())
                  rec = d.find_element(By.ID, "dbGuideRecommend")
                  global_skills = d.find_element(By.ID, "globalSkills")
                  rec_before = d.execute_script(
                      "return !!(arguments[0].compareDocumentPosition(arguments[1]) & Node.DOCUMENT_POSITION_FOLLOWING)",
                      rec, global_skills
                  )
                  if not rec_before:
                      raise RuntimeError("Trainer Guide recommended SSR strip should be directly before skill sections")
                  scopes = d.find_elements(By.CSS_SELECTOR, "#emptySlotScope [data-picker-scope]")
                  if len(scopes) != 3:
                      raise RuntimeError(f"Expected 3 deck picker scopes, got {len(scopes)}")
                  print("SSR COMPACT UI PASS")

                  # V7.11: direct deck-slot picker should open and expose all three scopes.
                  WebDriverWait(d, 25).until(
                      lambda x: x.execute_script("return typeof runtime !== 'undefined' && runtime.ready === true")
                  )
                  d.execute_script("openEmptySlotPicker(0)")
                  WebDriverWait(d, 8).until(lambda x: x.find_element(By.ID, "emptySlotModal").get_attribute("class").find("open") >= 0)
                  picker_cards = d.find_elements(By.CSS_SELECTOR, "#emptySlotCards .card")
                  if len(picker_cards) == 0:
                      raise RuntimeError("Deck-slot SSR picker opened but rendered no cards")
                  picker_imgs = d.find_elements(By.CSS_SELECTOR, "#emptySlotCards .card img")
                  if len(picker_imgs) == 0:
                      raise RuntimeError("Deck-slot SSR picker rendered no artwork")
                  art_fit = d.execute_script("return getComputedStyle(arguments[0]).objectFit", picker_imgs[0])
                  if art_fit != "contain":
                      raise RuntimeError(f"SSR picker artwork should preserve ratio with contain, got {art_fit}")
                  art_dims = d.execute_script("""
                      const i=arguments[0],r=i.getBoundingClientRect();
                      return {nw:i.naturalWidth,nh:i.naturalHeight,w:r.width,h:r.height};
                  """, picker_imgs[0])
                  if art_dims["nw"] and art_dims["nh"] and art_dims["w"] and art_dims["h"]:
                      if abs((art_dims["nw"]/art_dims["nh"])-(art_dims["w"]/art_dims["h"])) > 0.03:
                          raise RuntimeError(f"SSR picker artwork ratio changed: {art_dims}")
                  print("SSR PICKER ART RATIO PASS:", art_dims)
                  d.execute_script("document.getElementById('emptySlotModal').classList.remove('open')")
                  print("DECK SLOT PICKER PASS:", len(picker_cards))

                  tabs = d.find_elements(By.CSS_SELECTOR, ".tab")
                  print("TAB COUNT:", len(tabs))
                  if len(tabs) < 2:
                      raise RuntimeError("Expected at least 2 navigation tabs")

                  before = d.find_element(By.CSS_SELECTOR, ".page.active").get_attribute("id")
                  tabs[1].click()
                  time.sleep(0.4)
                  after = d.find_element(By.CSS_SELECTOR, ".page.active").get_attribute("id")
                  print("ACTIVE PAGE:", before, "->", after)
                  if before == after:
                      raise RuntimeError("Navigation tab click did not change active page")
                  if not d.find_element(By.ID, "watchPilotStart").is_displayed():
                      raise RuntimeError("Spectator screen-share start button is not visible in Trainer Guide")
                  print("WATCH PILOT UI PASS")
                  tabs[0].click()
                  time.sleep(0.3)

                  # V7.70.5: information tab must open without freezing the global UI,
                  # and the racetrack controls must render after the tab is selected.
                  info_tab = d.find_element(By.CSS_SELECTOR, '.tab[data-page="info"]')
                  d.execute_script("arguments[0].click()", info_tab)
                  WebDriverWait(d, 12).until(
                      lambda x: x.find_element(By.ID, "page-info").get_attribute("class").find("active") >= 0
                  )
                  WebDriverWait(d, 20).until(
                      lambda x: len(Select(x.find_element(By.ID, "racetrackPlace")).options) > 0
                  )
                  course_options = len(Select(d.find_element(By.ID, "racetrackCourse")).options)
                  if course_options == 0:
                      raise RuntimeError("Racetrack info tab opened but rendered no course options")
                  d.execute_script("arguments[0].click()", d.find_element(By.CSS_SELECTOR, '.tab[data-page="deck"]'))
                  WebDriverWait(d, 8).until(
                      lambda x: x.find_element(By.ID, "page-deck").get_attribute("class").find("active") >= 0
                  )
                  print("RACETRACK INFO / TAB RECOVERY PASS:", course_options)

                  check_scenario_badges(d)

                  # V7.12: Tresenken turn checklist shows all 3 ramen choices.
                  select_scenario(d, "tresenken")
                  d.execute_script("setTrainingGuidePhase('senior')")
                  WebDriverWait(d, 8).until(lambda x: len(x.find_elements(By.CSS_SELECTOR, "#ramenGuideBody .ramenThreeItem")) == 3)
                  senior_ramen = d.find_elements(By.CSS_SELECTOR, "#ramenGuideBody .ramenThreeItem")
                  stat_icons = d.find_elements(By.CSS_SELECTOR, "#ramenGuideBody .ramenStatIcon")
                  if len(senior_ramen) != 3 or len(stat_icons) == 0:
                      raise RuntimeError("Senior ramen checklist should show 3 regional ramen and stat icons")
                  d.execute_script("setTrainingGuidePhase('ura')")
                  ultimate_names = ["스페셜 트레센 라멘", "욕심쟁이 트레센 라멘", "주옥의 트레센 라멘"]
                  WebDriverWait(d, 8).until(
                      lambda x: all(
                          expected in (x.find_element(By.ID, "ramenGuideBody").get_attribute("textContent") or "")
                          for expected in ultimate_names
                      )
                  )
                  ura_text = d.find_element(By.ID, "ramenGuideBody").get_attribute("textContent") or ""
                  for expected in ultimate_names:
                      if expected not in ura_text:
                          raise RuntimeError(f"Missing ultimate ramen choice: {expected}")
                  # V7.13: no giant reference screenshot; effect text is carried by the three cards.
                  ramen_body = d.find_element(By.ID, "ramenGuideBody")
                  if len(ramen_body.find_elements(By.CSS_SELECTOR, ".ramenIngameRef")) != 0:
                      raise RuntimeError("Obsolete ramen reference screenshot is still rendered")
                  effect_lines = ramen_body.find_elements(By.CSS_SELECTOR, ".ramenEffectLine")
                  if len(effect_lines) < 6:
                      raise RuntimeError("Ramen three-choice cards are missing detailed effect text")
                  if "힌트 Lv+3" not in (ramen_body.get_attribute("textContent") or ""):
                      # Current phase may be senior; verify URA once more for corrected hint level.
                      d.execute_script("setTrainingGuidePhase('ura')")
                      WebDriverWait(d, 8).until(lambda x: "힌트 Lv+3" in (x.find_element(By.ID, "ramenGuideBody").get_attribute("textContent") or ""))
                  print("RAMEN TEXT GUIDE PASS:", len(effect_lines))

                  # V7.13: recommended SSR art must preserve the source card aspect ratio.
                  d.execute_script("setTrainingGuidePhase('senior')")
                  rec_imgs = d.find_elements(By.CSS_SELECTOR, ".recSupport img")
                  if rec_imgs:
                      fit = d.execute_script("return getComputedStyle(arguments[0]).objectFit", rec_imgs[0])
                      if fit != "contain":
                          raise RuntimeError(f"Recommended SSR artwork should use contain, got {fit}")
                      dims = d.execute_script("""
                          const i=arguments[0];
                          return {nw:i.naturalWidth,nh:i.naturalHeight,w:i.getBoundingClientRect().width,h:i.getBoundingClientRect().height};
                      """, rec_imgs[0])
                      if dims["nw"] and dims["nh"] and dims["w"] and dims["h"]:
                          natural = dims["nw"]/dims["nh"]
                          shown = dims["w"]/dims["h"]
                          if abs(natural-shown) > 0.03:
                              raise RuntimeError(f"SSR artwork ratio changed: natural={natural}, shown={shown}")
                  print("SSR ART RATIO PASS:", len(rec_imgs))

                  print("RAMEN THREE-CHOICE PASS")

                  # V7.12: character tier snapshot uses existing Uma portraits.
                  tier_tab = d.find_element(By.CSS_SELECTOR, '.tab[data-page="tier"]')
                  d.execute_script("arguments[0].click()", tier_tab)
                  d.execute_script("""
                      document.getElementById('tierGround').value='turf';
                      document.getElementById('tierDistance').value='mid';
                      document.getElementById('tierStyle').value='all';
                      renderTier();
                  """)
                  WebDriverWait(d, 8).until(lambda x: len(x.find_elements(By.CSS_SELECTOR, "#tierGrid .tierChar")) > 0)
                  tier_cards = d.find_elements(By.CSS_SELECTOR, "#tierGrid .tierChar")
                  tier_portraits = d.find_elements(By.CSS_SELECTOR, "#tierGrid .tierPortrait")
                  if len(tier_portraits) == 0:
                      raise RuntimeError("Uma tier rows rendered without character portraits")
                  print("UMA TIER PORTRAIT PASS:", len(tier_portraits), "/", len(tier_cards))
                  d.execute_script("arguments[0].click()", d.find_element(By.CSS_SELECTOR, '.tab[data-page="deck"]'))
                  time.sleep(0.2)

                  # V7.8: Twinkle Legends guide renders with all three in-game legend routes.
                  select_scenario(d, "legends")
                  d.execute_script("arguments[0].click()", d.find_element(By.CSS_SELECTOR, '.tab[data-page="guide"]'))
                  WebDriverWait(d, 8).until(
                      lambda x: x.find_element(By.ID, "page-guide").get_attribute("class").find("active") >= 0
                  )
                  legends = WebDriverWait(d, 12).until(
                      lambda x: x.find_element(By.ID, "legendsScenarioGuide")
                  )
                  # The scenario guide is intentionally CSS-hidden until trainingMode.
                  # Verify scenario activation + rendered DOM here, not viewport visibility.
                  if d.execute_script("return arguments[0].hidden", legends):
                      raise RuntimeError("Twinkle Legends guide remained hidden after selecting Legends")
                  legend_routes = d.find_elements(By.CSS_SELECTOR, "#legendsRouteGrid .legendsRoute")
                  if len(legend_routes) != 3:
                      raise RuntimeError(f"Expected 3 Legends routes, got {len(legend_routes)}")
                  legend_text = " ".join((x.get_attribute("textContent") or "") for x in legend_routes)
                  for expected in ["하이세이코", "스피드 심볼리", "세인트 라이트"]:
                      if expected not in legend_text:
                          raise RuntimeError(f"Missing Legends route: {expected}")
                  if not (d.find_element(By.ID, "legendsGuideBody").get_attribute("textContent") or "").strip():
                      raise RuntimeError("Twinkle Legends guide body is empty")
                  print("LEGENDS GUIDE PASS")

                  # V7.8: Korean Trainer Guide includes Masters Challenge races in its existing selector.
                  d.find_element(By.CSS_SELECTOR, '[data-app-server="kr"]').click()
                  WebDriverWait(d, 15).until(
                      lambda x: any(
                          o.get_attribute("value") == "kr_masters_2026_shuka"
                          for o in Select(x.find_element(By.ID, "conditionGuideRace")).options
                      )
                  )
                  masters_count = sum(
                      1 for o in Select(d.find_element(By.ID, "conditionGuideRace")).options
                      if (o.get_attribute("value") or "").startswith("kr_masters_")
                  )
                  if masters_count != 8:
                      raise RuntimeError(f"Expected 8 Masters targets, got {masters_count}")
                  print("MASTERS GUIDE PASS:", masters_count)

                  # Restore JP before the legacy mobile smoke because Tresenken is JP-only at this date.
                  d.find_element(By.CSS_SELECTOR, '[data-app-server="jp"]').click()
                  WebDriverWait(d, 12).until(
                      lambda x: Select(x.find_element(By.ID, "scenario")).first_selected_option.get_attribute("value") != ""
                  )
                  check_mobile(d)

                  logs = d.get_log("browser")
                  severe = [
                      x for x in logs
                      if x.get("level") == "SEVERE" and "favicon.ico" not in x.get("message", "")
                  ]
                  for x in logs:
                      print("BROWSER:", x.get("level"), x.get("message"))
                  if severe:
                      raise RuntimeError("Browser console has SEVERE errors: " + " | ".join(x.get("message","") for x in severe[:10]))

                  print("TARGET PASS:", name)
              finally:
                  d.quit()

          print("Deployed browser interaction smoke PASS")
          PY

      - name: Upload browser smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-log
          path: |
            p0-smoke.log
            browser-smoke.log
          if-no-files-found: ignore
