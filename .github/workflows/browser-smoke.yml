                  if "힌트 Lv+3" not in (ramen_body.get_attribute("textContent") or ""):
                      # Current phase may be senior; verify URA once more for corrected hint level.
                      d.execute_script("setTrainingGuidePhase('ura')")
                      WebDriverWait(d, 8).until(lambda x: "힌트 Lv+3" in (x.find_element(By.ID, "ramenGuideBody").get_attribute("textContent") or ""))
                  print("RAMEN TEXT GUIDE PASS:", len(effect_lines))

                  # V7.13: recommended SSR art must preserve the source card aspect ratio.
                  d.execute_script("setTrainingGuidePhase('senior')")
                  rec_imgs = d.find_elements(By.CSS_SELECTOR, ".recSupport img")
                  if rec_imgs:
                      fit = d.execute_script("return getComputedStyle(arguments[0]).objectFit", rec_imgs[0])
                      if fit != "contain":
                          raise RuntimeError(f"Recommended SSR artwork should use contain, got {fit}")
                      dims = d.execute_script("""
                          const i=arguments[0];
                          return {nw:i.naturalWidth,nh:i.naturalHeight,w:i.getBoundingClientRect().width,h:i.getBoundingClientRect().height};
                      """, rec_imgs[0])
                      if dims["nw"] and dims["nh"] and dims["w"] and dims["h"]:
                          natural = dims["nw"]/dims["nh"]
                          shown = dims["w"]/dims["h"]
                          if abs(natural-shown) > 0.03:
                              raise RuntimeError(f"SSR artwork ratio changed: natural={natural}, shown={shown}")
                  print("SSR ART RATIO PASS:", len(rec_imgs))

                  print("RAMEN THREE-CHOICE PASS")

                  # V7.12: character tier snapshot uses existing Uma portraits.
                  tier_tab = d.find_element(By.CSS_SELECTOR, '.tab[data-page="tier"]')
                  d.execute_script("arguments[0].click()", tier_tab)
                  d.execute_script("""
                      document.getElementById('tierGround').value='turf';
                      document.getElementById('tierDistance').value='mid';
                      document.getElementById('tierStyle').value='all';
                      renderTier();
                  """)
                  WebDriverWait(d, 8).until(lambda x: len(x.find_elements(By.CSS_SELECTOR, "#tierGrid .tierChar")) > 0)
                  tier_cards = d.find_elements(By.CSS_SELECTOR, "#tierGrid .tierChar")
                  tier_portraits = d.find_elements(By.CSS_SELECTOR, "#tierGrid .tierPortrait")
                  if len(tier_portraits) == 0:
                      raise RuntimeError("Uma tier rows rendered without character portraits")
                  print("UMA TIER PORTRAIT PASS:", len(tier_portraits), "/", len(tier_cards))
                  d.execute_script("arguments[0].click()", d.find_element(By.CSS_SELECTOR, '.tab[data-page="deck"]'))
                  time.sleep(0.2)

                  # V7.8: Twinkle Legends guide renders with all three in-game legend routes.
                  select_scenario(d, "legends")
                  d.execute_script("arguments[0].click()", d.find_element(By.CSS_SELECTOR, '.tab[data-page="guide"]'))
                  WebDriverWait(d, 8).until(
                      lambda x: x.find_element(By.ID, "page-guide").get_attribute("class").find("active") >= 0
                  )
                  legends = WebDriverWait(d, 12).until(
                      lambda x: x.find_element(By.ID, "legendsScenarioGuide")
                  )
                  # The scenario guide is intentionally CSS-hidden until trainingMode.
                  # Verify scenario activation + rendered DOM here, not viewport visibility.
                  if d.execute_script("return arguments[0].hidden", legends):
                      raise RuntimeError("Twinkle Legends guide remained hidden after selecting Legends")
                  legend_routes = d.find_elements(By.CSS_SELECTOR, "#legendsRouteGrid .legendsRoute")
                  if len(legend_routes) != 3:
                      raise RuntimeError(f"Expected 3 Legends routes, got {len(legend_routes)}")
                  legend_text = " ".join((x.get_attribute("textContent") or "") for x in legend_routes)
                  for expected in ["하이세이코", "스피드 심볼리", "세인트 라이트"]:
                      if expected not in legend_text:
                          raise RuntimeError(f"Missing Legends route: {expected}")
                  if not (d.find_element(By.ID, "legendsGuideBody").get_attribute("textContent") or "").strip():
                      raise RuntimeError("Twinkle Legends guide body is empty")
                  print("LEGENDS GUIDE PASS")

                  # V7.8: Korean Trainer Guide includes Masters Challenge races in its existing selector.
                  d.find_element(By.CSS_SELECTOR, '[data-app-server="kr"]').click()
                  WebDriverWait(d, 15).until(
                      lambda x: any(
                          o.get_attribute("value") == "kr_masters_2026_shuka"
                          for o in Select(x.find_element(By.ID, "conditionGuideRace")).options
                      )
                  )
                  masters_count = sum(
                      1 for o in Select(d.find_element(By.ID, "conditionGuideRace")).options
                      if (o.get_attribute("value") or "").startswith("kr_masters_")
                  )
                  if masters_count != 8:
                      raise RuntimeError(f"Expected 8 Masters targets, got {masters_count}")
                  print("MASTERS GUIDE PASS:", masters_count)

                  # Restore JP before the legacy mobile smoke because Tresenken is JP-only at this date.
                  d.find_element(By.CSS_SELECTOR, '[data-app-server="jp"]').click()
                  WebDriverWait(d, 12).until(
                      lambda x: Select(x.find_element(By.ID, "scenario")).first_selected_option.get_attribute("value") != ""
                  )
                  check_mobile(d)

                  logs = d.get_log("browser")
                  severe = [
                      x for x in logs
                      if x.get("level") == "SEVERE" and "favicon.ico" not in x.get("message", "")
                  ]
                  for x in logs:
                      print("BROWSER:", x.get("level"), x.get("message"))
                  if severe:
                      raise RuntimeError("Browser console has SEVERE errors: " + " | ".join(x.get("message","") for x in severe[:10]))

                  print("TARGET PASS:", name)
              except Exception as e:
                  if required:
                      raise
                  print("OPTIONAL TARGET WARN:", name, type(e).__name__, str(e))
              finally:
                  d.quit()

          print("Deployed browser interaction smoke PASS")
          PY

      - name: Upload browser smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-log
          path: |
            p0-smoke.log
            browser-smoke.log
          if-no-files-found: ignore
